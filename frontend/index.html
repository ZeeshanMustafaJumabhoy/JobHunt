<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem('shortlist-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Shortlist searches job boards and career pages, reads every posting against your resume with AI, and keeps only the jobs worth applying to. Built for people job hunting after a layoff."
    />
    <meta property="og:title" content="Shortlist" />
    <meta
      property="og:description"
      content="A local, open-source job search assistant. Find the jobs you can actually get, and see what to fix on your resume before you apply."
    />
    <meta property="og:image" content="/logo-192.png" />
    <title>Shortlist — find the jobs you can actually get</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
