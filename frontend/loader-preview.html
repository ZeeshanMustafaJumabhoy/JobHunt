<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loader preview</title>
    <script>
      try {
        var t = localStorage.getItem('shortlist-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/loader-preview-entry.tsx"></script>
  </body>
</html>
